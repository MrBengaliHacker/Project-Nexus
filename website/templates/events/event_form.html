{% extends 'base.html' %} {% block title %}Create Event{% endblock %} {% block content %}
<div class="max-w-3xl mx-auto">
	<div class="card bg-base-100 shadow nx-card">
		<div class="card-body">
			<div class="flex items-center justify-between">
				<h2 class="card-title">Create Event</h2>
				<a class="btn btn-ghost btn-sm" href="{{ url_for('events.event_list') }}">Back</a>
			</div>
			<form method="post" enctype="multipart/form-data" class="space-y-4">
				<div class="form-control">
					<label class="label" for="title"><span class="label-text">Title</span></label>
					<input id="title" name="title" type="text" class="input input-bordered" required />
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<div class="form-control">
						<label class="label" for="start_time"><span class="label-text">Start</span></label>
						<input id="start_time" name="start_time" type="datetime-local" class="input input-bordered" required />
					</div>
					<div class="form-control">
						<label class="label" for="end_time"><span class="label-text">End</span></label>
						<input id="end_time" name="end_time" type="datetime-local" class="input input-bordered" required />
					</div>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<div class="form-control">
						<label class="label" for="location"><span class="label-text">Location</span></label>
						<input id="location" name="location" type="text" class="input input-bordered" placeholder="Auditorium, Lab 3, ..." />
					</div>
					<div class="form-control">
						<label class="label" for="category"><span class="label-text">Category (optional)</span></label>
						<input id="category" name="category" type="text" class="input input-bordered" placeholder="Workshop, Seminar, ..." />
					</div>
				</div>

				<div class="form-control">
					<label class="label" for="registration_link"><span class="label-text">Registration link (optional)</span></label>
					<input id="registration_link" name="registration_link" type="url" class="input input-bordered" placeholder="https://..." />
				</div>

				<div class="form-control">
					<label class="label" for="description"><span class="label-text">Description</span></label>
					<textarea id="description" name="description" class="textarea textarea-bordered min-h-36" placeholder="Details, agenda, speakers..."></textarea>
				</div>

				<div class="form-control">
					<label class="label" for="file"><span class="label-text">Attachment (optional)</span></label>
					<input id="file" name="file" type="file" class="file-input file-input-bordered w-full" />
				</div>

				<div class="flex items-center gap-2 pt-2">
					<button type="submit" class="btn btn-primary">Create</button>
					<a class="btn btn-ghost" href="{{ url_for('events.event_list') }}">Cancel</a>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %}
