{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card">
  <h2>Login</h2>
  <p class="muted">Sign in to continue</p>

  <form method="post" style="margin-top:.75rem">
    <div style="margin-bottom:.5rem">
      <label for="username">Username or email</label>
      <input id="username" name="username" required class="" style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div style="margin-bottom:.5rem">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required class="" style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div class="actions">
      <button class="btn" type="submit">Sign in</button>
      <a href="{{ url_for('auth.register') }}" class="btn">Register</a>
    </div>
  </form>
</div>
{% endblock %}
