{% extends 'base.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="card">
  <h2>Create account</h2>
  <p class="muted">Register a new user</p>

  <form method="post" style="margin-top:.75rem">
    <div style="margin-bottom:.5rem">
      <label for="name">Full name</label>
      <input id="name" name="name" required style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div style="margin-bottom:.5rem">
      <label for="username">Username</label>
      <input id="username" name="username" required style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div style="margin-bottom:.5rem">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div style="margin-bottom:.5rem">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
    </div>
    <div style="margin-bottom:.5rem">
      <label for="role">Role</label>
      <select id="role" name="role" required style="width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #e6e6e6;border-radius:6px">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="faculty">Faculty</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div class="actions">
      <button class="btn" type="submit">Create</button>
      <a href="{{ url_for('auth.login') }}" class="btn">Sign in</a>
    </div>
  </form>
</div>
{% endblock %}
