{% extends 'base.html' %} {% block title %}{{ 'Edit' if announcement else 'New' }} Announcement{% endblock %} {% block content %}
<div class="max-w-3xl mx-auto">
	<div class="card bg-base-100 shadow nx-card">
		<div class="card-body">
			<div class="flex items-center justify-between">
				<h2 class="card-title">{{ announcement and 'Edit' or 'New' }} Announcement</h2>
				<a class="btn btn-ghost btn-sm" href="{{ url_for('announcements.announcement_list') }}">Back</a>
			</div>
			<form method="post" enctype="multipart/form-data" class="space-y-4">
				<div class="form-control">
					<label for="title" class="label"><span class="label-text">Title</span></label>
					<input id="title" name="title" type="text" class="input input-bordered" required value="{{ announcement.title if announcement else '' }}" />
				</div>

				<div class="form-control">
					<label for="content" class="label"><span class="label-text">Content</span></label>
					<textarea id="content" name="content" class="textarea textarea-bordered min-h-40" required>{{ announcement.content if announcement else '' }}</textarea>
				</div>

				<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
					<div class="form-control">
						<label for="category" class="label"><span class="label-text">Category (optional)</span></label>
						<input id="category" name="category" type="text" class="input input-bordered" value="{{ announcement.category if announcement else '' }}" placeholder="e.g. Exam, Notice, General" />
					</div>
					<div class="form-control">
						<label for="tags" class="label"><span class="label-text">Tags (comma-separated)</span></label>
						<input id="tags" name="tags" type="text" class="input input-bordered" value="{{ tags_str if tags_str is defined else '' }}" placeholder="e.g. urgent, semester-5" />
					</div>
				</div>

				<div class="form-control">
					<label class="cursor-pointer label justify-start gap-3">
						<input type="checkbox" name="is_pinned" class="checkbox checkbox-primary" {% if announcement and announcement.is_pinned %}checked{% endif %} />
						<span class="label-text">Pin this announcement</span>
					</label>
				</div>

				<div class="form-control">
					<label for="file" class="label"><span class="label-text">Attachment (optional)</span></label>
					<input id="file" name="file" type="file" class="file-input file-input-bordered w-full" />
					{% if announcement and announcement.file_url %}
					<a href="{{ announcement.file_url }}" class="link mt-1" target="_blank" rel="noopener">Current attachment</a>
					{% endif %}
				</div>

				<div class="flex items-center gap-2 pt-2">
					<button class="btn btn-primary" type="submit">{{ announcement and 'Update' or 'Post' }}</button>
					<a class="btn btn-ghost" href="{{ url_for('announcements.announcement_list') }}">Cancel</a>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %}
