{% extends 'base.html' %} {% block title %}New Post{% endblock %} {% block content %}
<div class="max-w-3xl mx-auto">
	<div class="card bg-base-100 shadow">
		<div class="card-body">
			<div class="flex items-center justify-between gap-3">
				<h1 class="card-title">Create a New Post</h1>
				<a href="{{ url_for('feed.feed') }}" class="btn btn-ghost btn-sm">Back</a>
			</div>

			<form action="{{ url_for('feed.new_post') }}" method="POST" enctype="multipart/form-data" class="space-y-5">
				<div class="grid grid-cols-1 gap-4">
					<div class="form-control">
						<label class="label"><span class="label-text">Title</span></label>
						<input type="text" name="title" class="input input-bordered" placeholder="What’s on your mind?" required />
					</div>

					<div class="form-control">
						<label class="label"><span class="label-text">Content</span><span class="label-text-alt" id="charCount">0/1000</span></label>
						<textarea name="content" id="content" maxlength="1000" class="textarea textarea-bordered h-48" placeholder="Share an update, ask a question, or post a notice..." required></textarea>
					</div>

					{% if tags %}
					<div class="form-control">
						<label class="label"><span class="label-text">Tags</span><span class="label-text-alt">Select up to 5</span></label>
						<div class="flex flex-wrap gap-2">
							{% for t in tags %}
							<label class="badge badge-ghost cursor-pointer gap-2 py-3">
								<input type="checkbox" name="tags" value="{{ t.id }}" class="checkbox checkbox-xs" onclick="limitTags(this, 5)" />
								#{{ t.name }}
							</label>
							{% endfor %}
						</div>
					</div>
					{% else %}
					<div class="form-control">
						<label class="label"><span class="label-text">Tags (comma separated)</span></label>
						<input type="text" name="tags" placeholder="e.g., campus, event, notice" class="input input-bordered" />
					</div>
					{% endif %}

					<div class="form-control">
						<label class="label"><span class="label-text">Attachment (optional)</span><span class="label-text-alt">Images/PDF up to 10MB</span></label>
						<input type="file" name="file" id="fileInput" class="file-input file-input-bordered w-full" accept="image/*,.pdf,.docx" />
						<div id="filePreview" class="mt-3 hidden">
							<img id="previewImg" class="max-h-56 rounded-lg shadow" alt="preview" />
							<p id="previewName" class="text-sm text-base-content/60 mt-2"></p>
						</div>
					</div>
				</div>

				<div class="flex items-center gap-2">
					<button type="submit" class="btn btn-primary">Publish</button>
					<a href="{{ url_for('feed.feed') }}" class="btn">Cancel</a>
				</div>
			</form>
		</div>
	</div>
</div>
{% endblock %} {% block scripts %}
<script>
	const contentEl = document.getElementById("content");
	const charCountEl = document.getElementById("charCount");
	if (contentEl && charCountEl) {
		const updateCount = () => (charCountEl.textContent = `${contentEl.value.length}/1000`);
		contentEl.addEventListener("input", updateCount);
		updateCount();
	}

	function limitTags(cb, limit) {
		const checked = document.querySelectorAll('input[name="tags"]:checked');
		if (checked.length > limit) {
			cb.checked = false;
			const toast = document.createElement("div");
			toast.className = "toast toast-top toast-center";
			toast.innerHTML = '<div class="alert alert-warning"><span>Maximum tag limit reached.</span></div>';
			document.body.appendChild(toast);
			setTimeout(() => toast.remove(), 1500);
		}
	}

	const fileInput = document.getElementById("fileInput");
	const previewWrap = document.getElementById("filePreview");
	const previewImg = document.getElementById("previewImg");
	const previewName = document.getElementById("previewName");
	if (fileInput) {
		fileInput.addEventListener("change", () => {
			const file = fileInput.files[0];
			if (!file) {
				previewWrap.classList.add("hidden");
				return;
			}
			if (file.size > 10 * 1024 * 1024) {
				// 10MB
				alert("File too large. Max 10MB.");
				fileInput.value = "";
				previewWrap.classList.add("hidden");
				return;
			}
			previewName.textContent = file.name + ` (${Math.round(file.size / 1024)} KB)`;
			if (file.type.startsWith("image/")) {
				const reader = new FileReader();
				reader.onload = (e) => {
					previewImg.src = e.target.result;
					previewWrap.classList.remove("hidden");
				};
				reader.readAsDataURL(file);
			} else {
				previewImg.src = "";
				previewWrap.classList.add("hidden");
			}
		});
	}
</script>
{% endblock %}
