<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KampusConnect{% endblock %}</title>

  <!-- SEO Meta Tags -->
  <meta name="description" content="KampusConnect - One platform for all your campus needs. Connect, learn, and grow with our smart campus solution.">
  <meta name="keywords" content="college, campus, education, technology, smart campus, student portal">
  <meta name="author" content="KampusConnect Team">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

  <!-- DaisyUI + Tailwind -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.0/dist/full.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(45deg, #667eea, #764ba2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(45deg, #5a67d8, #6b46c1);
    }

    /* Smooth transitions */
    * {
      transition: all 0.3s ease;
    }

    /* Loading animation */
    .loading {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
    }

    @keyframes loading {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-base-100 text-base-content min-h-screen">
  <!-- Skip to main content for accessibility -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-primary text-white px-4 py-2 rounded-lg z-50">
    Skip to main content
  </a>

  {% block content %}{% endblock %}

  <!-- Global Scripts -->
  <script>
    // Theme management
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Initialize theme on load
    document.addEventListener('DOMContentLoaded', initTheme);

    // Loading states
    function showLoading(element) {
      element.classList.add('loading');
    }

    function hideLoading(element) {
      element.classList.remove('loading');
    }

    // Toast notifications
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `alert alert-${type} fixed top-4 right-4 z-50 max-w-sm shadow-lg`;
      toast.innerHTML = `
        <span>${message}</span>
        <button class="btn btn-sm btn-circle btn-ghost" onclick="this.parentElement.remove()">×</button>
      `;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 5000);
    }
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
